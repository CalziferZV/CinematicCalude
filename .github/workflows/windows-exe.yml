name: Ejecutable de Windows

# Compila FilamentStudio.exe, lo arranca en un Windows real para comprobar que funciona
# y deja el ZIP descargable en la pestaña "Actions" de GitHub (sección Artifacts).
on:
  push:
    branches: ['main', 'claude/**']
    paths:
      - 'public/**'
      - 'server/**'
      - 'scripts/**'
      - 'data/snapshot/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar el .exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: FilamentStudio-Windows
          path: dist/FilamentStudio-Windows.zip
          retention-days: 30

  smoke-test:
    name: Probar el .exe en Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FilamentStudio-Windows
      - name: Arrancar FilamentStudio.exe y comprobar que responde
        shell: pwsh
        env:
          FS_NO_BROWSER: '1'
        run: |
          Expand-Archive FilamentStudio-Windows.zip -DestinationPath out
          $exe = Resolve-Path out\FilamentStudio\FilamentStudio.exe
          (Get-Item $exe).VersionInfo | Format-List ProductName, FileDescription, FileVersion
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput out\salida.txt -RedirectStandardError out\errores.txt
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://127.0.0.1:5173/api/ping; if ($r.app -eq 'filament-studio') { $ok = $true; break } } catch {}
          }
          Get-Content out\salida.txt -ErrorAction SilentlyContinue
          Get-Content out\errores.txt -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'El ejecutable no ha respondido' }
          $html = (Invoke-WebRequest http://127.0.0.1:5173/ -UseBasicParsing).Content
          if ($html -notmatch 'Filament Studio' -or $html -notmatch 'app.js') { throw 'La interfaz no se ha servido bien' }
          $js = Invoke-WebRequest http://127.0.0.1:5173/app.js -UseBasicParsing
          Write-Host "app.js: $($js.RawContentLength) bytes"
          $stl = Invoke-WebRequest http://127.0.0.1:5173/samples/trofeo.stl -UseBasicParsing
          Write-Host "trofeo.stl: $($stl.RawContentLength) bytes"
          $b = Invoke-RestMethod http://127.0.0.1:5173/api/brands/bambulab
          $n = ($b.lines | ForEach-Object { $_.colors.Count } | Measure-Object -Sum).Sum
          Write-Host "Bambu Lab: $n colores (origen: $($b.origin))"
          if ($n -lt 100) { throw 'El catálogo no ha cargado' }
          $s = Invoke-RestMethod http://127.0.0.1:5173/api/brands/sunlu
          Write-Host "Sunlu: $($s.lines.Count) líneas (origen: $($s.origin))"
          $null = Invoke-RestMethod -Method Put -Uri http://127.0.0.1:5173/api/prefs -Headers @{ Origin = 'http://localhost:5173' } -ContentType 'application/json' -Body '{"ci":1}'
          $back = Invoke-RestMethod http://127.0.0.1:5173/api/prefs
          if ($back.ci -ne 1) { throw 'Las preferencias no se guardan' }
          Write-Host "Preferencias guardadas en $env:LOCALAPPDATA\FilamentStudio\prefs.json"
          $all = Invoke-RestMethod http://127.0.0.1:5173/api/catalog/all
          Write-Host "Catálogo completo: $($all.brands.Count) marcas"
          if ($all.brands.Count -lt 50) { throw 'El catálogo completo no ha cargado' }
          $font = Invoke-RestMethod http://127.0.0.1:5173/fonts/moderna.typeface.json
          if (-not $font.glyphs.'ñ') { throw 'Faltan las fuentes del texto 3D' }
          Write-Host "Fuente del texto 3D: $($font.familyName)"
          $sl = Invoke-RestMethod http://127.0.0.1:5173/api/slicers
          Write-Host "Laminadores instalados: Bambu Studio=$($sl.bambu.found) OrcaSlicer=$($sl.orca.found) PrusaSlicer=$($sl.prusa.found)"
          Get-ChildItem "$env:LOCALAPPDATA\FilamentStudio" -Recurse | Select-Object -First 5 | ForEach-Object { Write-Host "  datos: $($_.FullName)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'FilamentStudio.exe funciona en Windows'
